<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00FF88">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Video Player</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <header class="text-white p-4 text-center">
        <h1 class="text-3xl font-bold">Golden Video Player</h1>
    </header>
    <main class="container mx-auto p-4 pt-6 md:p-6 lg:p-12 xl:p-24">
        <div class="glass p-4 md:p-6 lg:p-12 xl:p-24 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4">Play Your Favorite Videos</h2>
            <input type="file" id="file" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" accept=".mp3, .ogg, .mp4, .avi, .mov, .wmv">
            <button id="play" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded mt-4">Play</button>
            <button id="pause" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded mt-4">Pause</button>
            <button id="stop" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded mt-4">Stop</button>
            <audio id="audio" src="" type="audio/mp3"></audio>
            <video id="video" src="" type="video/mp4" width="100%" height="400" controls></video>
        </div>
    </main>
    <script>
        const fileInput = document.getElementById('file');
        const playButton = document.getElementById('play');
        const pauseButton = document.getElementById('pause');
        const stopButton = document.getElementById('stop');
        const audio = document.getElementById('audio');
        const video = document.getElementById('video');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);
            if (file.type.includes('audio')) {
                audio.src = url;
                video.src = '';
            } else {
                video.src = url;
                audio.src = '';
            }
        });

        playButton.addEventListener('click', () => {
            if (audio.src) {
                audio.play();
            } else {
                video.play();
            }
        });

        pauseButton.addEventListener('click', () => {
            if (audio.src) {
                audio.pause();
            } else {
                video.pause();
            }
        });

        stopButton.addEventListener('click', () => {
            if (audio.src) {
                audio.currentTime = 0;
                audio.pause();
            } else {
                video.currentTime = 0;
                video.pause();
            }
        });
    </script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>
